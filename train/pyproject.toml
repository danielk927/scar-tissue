[project]
name = "scar-train"
version = "0.1.0"
description = "Scar Tissue train service (Person 3): model registry, training data, Veri jobs, promotion gate, loop runner"
requires-python = ">=3.11"
dependencies = [
    "scar-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "sentry-sdk>=2.0",
    "veri-sdk==0.2.44",
    "transformers==4.56.2",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx2>=2.13"]

[tool.uv.sources]
scar-schemas = { path = "../schemas", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scar_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP042: shared enums are (str, Enum). UP017: spec 7.4 writes datetime.now(timezone.utc).
ignore = ["UP042", "UP017"]
