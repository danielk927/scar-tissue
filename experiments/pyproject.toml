[project]
name = "scar-experiments"
version = "0.1.0"
description = "Scar Tissue experiments (Person 1): arm B and C learn-steps, results report"
requires-python = ">=3.11"
dependencies = [
    "scar-schemas",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=1.40",
    "gepa==0.1.4",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
scar-schemas = { path = "../schemas", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scar_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP042: shared enums are (str, Enum). UP017: spec 7.4 writes datetime.now(timezone.utc).
ignore = ["UP042", "UP017"]
