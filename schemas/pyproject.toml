[project]
name = "scar-schemas"
version = "1.0.0"
description = "Shared contracts for Scar Tissue (SPEC Section 8)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scar_schemas"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP042: the contract's enums are (str, Enum). UP017: spec 7.4 writes datetime.now(timezone.utc).
ignore = ["UP042", "UP017"]
