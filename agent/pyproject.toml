[project]
name = "scar-agent"
version = "0.1.0"
description = "Scar Tissue agent service: agent loop, run storage, Sentry tracing, Jev failure mining, judge flow"
requires-python = ">=3.11"
dependencies = [
    "scar-schemas",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "httpx>=0.27",
    "openai>=1.50",
    "sentry-sdk>=2.64.0",  # standalone gen_ai span items (docs/SENTRY.md)
    "typesafe-sdk>=0.7.5,<0.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv.sources]
scar-schemas = { path = "../schemas", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scar_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP035"]
ignore = ["E501"]  # contract strings (SPEC 9.4) stay verbatim
